name: ZuviPro
type: theme
base theme: stable9
description: 'A light weight, flexible, fully responsive and multi-purpose Drupal 9, 10, 11 theme by <a href="https://drupar.com" target="_blank">Drupar.com</a>'
package: Drupar
# Define Drupal core requirement
core_version_requirement: ^9 || ^10 || ^11
version: 11.1.1
# Libraries
libraries:
  - zuvipro/global-styling
  - zuvipro/global-scripts
